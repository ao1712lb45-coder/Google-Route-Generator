[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "google-route-generator"
version = "0.2.0"
description = "Generate professional travel route maps from itinerary PDFs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "folium>=0.17,<1",
  "geopy>=2.4,<3",
  "pypdf>=5,<6",
  "python-multipart>=0.0.20,<1",
  "requests>=2.32,<3",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
route-map = "google_route_generator.cli:app"
route-map-web = "google_route_generator.web:run"

[tool.hatch.build.targets.wheel]
packages = ["src/google_route_generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

